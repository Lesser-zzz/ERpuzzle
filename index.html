<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이터널리턴 3:3 구도 퍼즐</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c2f33; color: white; text-align: center; margin: 0; padding: 20px; }
        
        .control-panel { background: #2f3542; border: 2px solid #57606f; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: inline-block; text-align: left; max-width: 1050px; }
        .control-row { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .control-label { font-weight: bold; width: 60px; color: #ffa502; font-size: 14px; }
        select { padding: 4px; border-radius: 4px; background: #1e272e; color: white; border: 1px solid #57606f; font-size: 12px; }
        select option:disabled { color: #747d8c; background: #2f3542; }

        .battlefield { position: relative; width: 900px; height: 500px; margin: 0 auto; background-color: #1e272e; border: 3px solid #57606f; border-radius: 12px; overflow: hidden; }
        .character-card { position: absolute; width: 140px; background: rgba(47, 53, 66, 0.85); border: 2px solid; border-radius: 8px; padding: 6px; text-align: left; transform: translate(-50%, -50%); transition: all 0.2s ease-in-out; cursor: pointer; z-index: 1; }
        .character-card:hover { background: rgba(47, 53, 66, 1); transform: translate(-50%, -50%) scale(1.15); z-index: 10; box-shadow: 0 8px 12px rgba(0,0,0,0.8); }
        .blue-team { border-color: #1e90ff; }
        .red-team { border-color: #ff4757; }
        .char-img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; background: #747d8c; }
        .char-name { font-size: 14px; font-weight: bold; margin: 5px 0 2px 0; color: #f1f2f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-vars { font-size: 11px; color: #a4b0be; line-height: 1.3; margin-bottom: 4px; }
        .items { font-size: 10px; color: #eccc68; line-height: 1.2; word-break: keep-all; }
        
        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .action-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        #reroll-btn { background-color: #ffa502; color: #2f3542; }
        #reroll-btn:hover { background-color: #ff7f50; }
        #eval-btn { background-color: #1e90ff; color: white; }
        #eval-btn:hover { background-color: #3742fa; }
        
        #evaluation-result { 
            display: none; margin: 20px auto; padding: 20px; background: #2f3542; 
            border: 2px dashed #1e90ff; border-radius: 8px; max-width: 800px; font-size: 16px; line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>이터널리턴 3:3 구도 퍼즐</h1>
    
    <div class="control-panel">
        <div class="control-row">
            <span class="control-label">환경:</span>
            <select id="env-time"><option value="">시간 (랜덤)</option><option value="낮">낮</option><option value="밤">밤</option></select>
            <select id="env-terrain"><option value="">지형 (랜덤)</option><option value="좁은 골목">좁은 골목</option><option value="개활지">개활지</option><option value="벽과 장애물 지역">벽과 장애물</option></select>
        </div>
        <hr style="border-color: #57606f;">
        <div id="blue-controls"></div>
        <hr style="border-color: #57606f;">
        <div id="red-controls"></div>
    </div>
    
    <div id="env-display" style="font-size: 18px; font-weight: bold; color: #ffa502; margin-bottom: 10px;"></div>
    
    <div class="battlefield" id="battlefield-container"></div>
    
    <div class="btn-group">
        <button id="reroll-btn" class="action-btn" onclick="rollDice()">🎲 설정 적용 & 셔플</button>
        <button id="eval-btn" class="action-btn" onclick="showEvaluation()">💡 모범 답안 보기 (Beta)</button>
    </div>

    <!-- 평가 함수 결과창 -->
    <div id="evaluation-result"></div>

    <script>
        let characterPool = [];
        let currentBlueTeam = []; // 평가 함수용 데이터 저장
        let currentRedTeam = [];

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                characterPool = data;
                initDropdowns();
                rollDice();
            });

        function initDropdowns() {
            let charOpts = '<option value="">캐릭터 (랜덤)</option>';
            characterPool.forEach(c => {
                const descText = c.description ? ` - ${c.description}` : '';
                charOpts += `<option value="${c.id}">${c.name} (${c.weapon})${descText}</option>`;
            });

            const hpOpts = `<option value="">체력 (랜덤)</option><option value="100">100%</option><option value="70">70%</option><option value="50">50%</option>`;
            const ultOpts = `<option value="">궁극기 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            const wSkillOpts = `<option value="">무스 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            const tacSkillOpts = `<option value="">전술 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            
            let lvlOpts = '<option value="">레벨 (랜덤)</option>';
            for(let i=10; i<=20; i++) lvlOpts += `<option value="${i}">Lv.${i}</option>`;
            
            let itemOpts = '<option value="">아이템 (랜덤)</option>';
            for(let i=0; i<=5; i++) itemOpts += `<option value="${i}">${i}코어</option>`;

            const createTeamControls = (teamName, prefix) => {
                let html = `<div class="control-label" style="color:${prefix==='b'?'#1e90ff':'#ff4757'}">${teamName}</div>`;
                for(let i=0; i<3; i++) {
                    html += `
                        <div class="control-row" style="margin-left: 10px;">
                            <span style="color:#a4b0be; font-size:12px; width:40px; display:inline-block;">Slot ${i+1}:</span>
                            <select id="${prefix}-char-${i}" onchange="updateTeamDisables('${prefix}')">${charOpts}</select>
                            <select id="${prefix}-hp-${i}">${hpOpts}</select>
                            <select id="${prefix}-lvl-${i}">${lvlOpts}</select>
                            <select id="${prefix}-item-${i}">${itemOpts}</select>
                            <select id="${prefix}-ult-${i}">${ultOpts}</select>
                            <select id="${prefix}-wskill-${i}">${wSkillOpts}</select>
                            <select id="${prefix}-tac-${i}">${tacSkillOpts}</select>
                        </div>`;
                }
                return html;
            };

            document.getElementById('blue-controls').innerHTML = createTeamControls('BLUE', 'b');
            document.getElementById('red-controls').innerHTML = createTeamControls('RED', 'r');
        }

        function updateTeamDisables(teamPrefix) {
            let selectedIds = [];
            for(let i=0; i<3; i++) {
                const val = document.getElementById(`${teamPrefix}-char-${i}`).value;
                if(val) selectedIds.push(val);
            }
            
            for(let i=0; i<3; i++) {
                const selectEl = document.getElementById(`${teamPrefix}-char-${i}`);
                const currentVal = selectEl.value;
                
                Array.from(selectEl.options).forEach(opt => {
                    opt.disabled = (opt.value !== "" && selectedIds.includes(opt.value) && opt.value !== currentVal);
                });
            }
        }

        function rollDice() {
            if (characterPool.length === 0) return;
            document.getElementById('evaluation-result').style.display = 'none'; // 셔플 시 답안 숨기기
            currentBlueTeam = [];
            currentRedTeam = [];

            const timeVal = document.getElementById('env-time').value || ['낮', '밤'][Math.floor(Math.random() * 2)];
            const terrainVal = document.getElementById('env-terrain').value || ['좁은 골목', '개활지', '벽과 장애물 지역'][Math.floor(Math.random() * 3)];
            document.getElementById('env-display').innerText = `현재 전장: ${timeVal} / ${terrainVal}`;

            const baseLevel = Math.floor(Math.random() * (16 - 10 + 1)) + 10; 
            
            let usedIdsBlue = [];
            let usedIdsRed = [];
            for(let i=0; i<3; i++) {
                let bVal = document.getElementById(`b-char-${i}`).value;
                let rVal = document.getElementById(`r-char-${i}`).value;
                if(bVal) usedIdsBlue.push(bVal);
                if(rVal) usedIdsRed.push(rVal);
            }

            let html = '';

            const createSlot = (teamPrefix, index, isBlue) => {
                const charVal = document.getElementById(`${teamPrefix}-char-${index}`).value;
                const hpVal = document.getElementById(`${teamPrefix}-hp-${index}`).value;
                const lvlVal = document.getElementById(`${teamPrefix}-lvl-${index}`).value;
                const itemVal = document.getElementById(`${teamPrefix}-item-${index}`).value;
                const ultVal = document.getElementById(`${teamPrefix}-ult-${index}`).value;
                const wSkillVal = document.getElementById(`${teamPrefix}-wskill-${index}`).value;
                const tacVal = document.getElementById(`${teamPrefix}-tac-${index}`).value;

                let charData;
                if (charVal) {
                    charData = characterPool.find(c => c.id === charVal);
                } else {
                    let teamUsedIds = isBlue ? usedIdsBlue : usedIdsRed;
                    let availableChars = characterPool.filter(c => !teamUsedIds.includes(c.id));
                    charData = availableChars[Math.floor(Math.random() * availableChars.length)];
                    teamUsedIds.push(charData.id); 
                }

                const finalHp = hpVal ? parseInt(hpVal) : [100, 70, 50][Math.floor(Math.random() * 3)];
                const finalLvl = lvlVal ? parseInt(lvlVal) : baseLevel + Math.floor(Math.random() * 3);
                const finalItemCount = itemVal !== "" ? parseInt(itemVal) : Math.floor(Math.random() * 6);
                const finalUlt = ultVal ? ultVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                const finalWskill = wSkillVal ? wSkillVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                const finalTac = tacVal ? tacVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                
                // 평가 함수 계산을 위해 현재 상태 저장
                const matchData = { name: charData.name, weapon: charData.weapon, role: charData.role, hp: finalHp, level: finalLvl, items: finalItemCount, ult: finalUlt, wskill: finalWskill, tac: finalTac };
                if (isBlue) currentBlueTeam.push(matchData);
                else currentRedTeam.push(matchData);

                const posX = isBlue ? Math.floor(Math.random() * 41) + 5 : Math.floor(Math.random() * 41) + 55;
                const posY = Math.floor(Math.random() * 81) + 10;
                
                const itemsText = finalItemCount > 0 ? charData.core_items_order.slice(0, finalItemCount).join(', ') : '전설 없음';
                const roleBadge = charData.role ? `<span style="background: #ffa502; color: #2f3542; padding: 2px 4px; border-radius: 4px; font-weight: bold; font-size: 10px;">${charData.role}</span>` : '';

                return `
                    <div class="character-card ${isBlue ? 'blue-team' : 'red-team'}" style="left: ${posX}%; top: ${posY}%;">
                        <img src="${charData.image}" alt="${charData.name}" class="char-img" onerror="this.style.display='none'">
                        <h3 class="char-name">${charData.name} (${charData.weapon})</h3>
                        <div class="char-vars">
                            ${roleBadge} Lv.${finalLvl} | 체력: ${finalHp}%<br>
                            궁: ${finalUlt} | 무스: ${finalWskill} | 전술: ${finalTac}
                        </div>
                        <div class="items">코어: ${itemsText}</div>
                    </div>
                `;
            };

            for(let i=0; i<3; i++) html += createSlot('b', i, true);
            for(let i=0; i<3; i++) html += createSlot('r', i, false);

            document.getElementById('battlefield-container').innerHTML = html;
        }

        // 평가 함수 엔진
        function showEvaluation() {
            if (currentBlueTeam.length === 0) return;

            const getPowerScore = (team) => {
                return team.reduce((sum, char) => {
                    let score = (char.level * 10) + (char.items * 15);
                    if (char.ult === 'ON') score += 30;
                    if (char.wskill === 'ON') score += 15;
                    if (char.tac === 'ON') score += 20;
                    // 체력 비례 적용 (반피면 전투력 절반)
                    score = score * (char.hp / 100);
                    return sum;
                }, 0);
            };

            const bluePower = getPowerScore(currentBlueTeam);
            const redPower = getPowerScore(currentRedTeam);
            const totalPower = bluePower + redPower;

            const isBlueAdvantage = bluePower >= redPower;
            const winRate = ((Math.max(bluePower, redPower) / totalPower) * 100).toFixed(1);
            const winningTeam = isBlueAdvantage ? "<span style='color:#1e90ff'>블루팀</span>" : "<span style='color:#ff4757'>레드팀</span>";

            // 불리한 팀의 가장 취약한 타겟 찾기
            const getPrimaryTarget = (team) => {
                let maxScore = -1;
                let target = null;
                team.forEach(char => {
                    let targetScore = (100 - char.hp) * 2; // 체력이 낮을수록 타겟 1순위
                    if (char.ult === '쿨다운') targetScore += 50; 
                    if (char.tac === '쿨다운') targetScore += 30;
                    
                    if (targetScore > maxScore) {
                        maxScore = targetScore;
                        target = char;
                    }
                });
                return target;
            };

            const targetChar = isBlueAdvantage ? getPrimaryTarget(currentRedTeam) : getPrimaryTarget(currentBlueTeam);

            const resultHtml = `
                <strong style="color: #ffa502; font-size: 18px;">[엔진 평가 결과]</strong><br><br>
                📊 <strong>판세 분석:</strong> 하드코딩된 가중치 기준, 현재 <strong>${winningTeam}</strong>이(가) 약 <strong>${winRate}%</strong> 유리한 구도입니다.<br><br>
                🎯 <strong>최우선 포커싱 타겟:</strong> <strong>${targetChar.name} (${targetChar.weapon})</strong><br>
                <span style="font-size: 14px; color: #a4b0be;">(산출 사유: 체력 ${targetChar.hp}% 상태 및 궁극기/전술 스킬 유무 복합 계산)</span>
            `;

            const resultDiv = document.getElementById('evaluation-result');
            resultDiv.innerHTML = resultHtml;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
