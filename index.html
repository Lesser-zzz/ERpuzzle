<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이터널리턴 3:3 구도 퍼즐</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c2f33; color: white; text-align: center; margin: 0; padding: 20px; }
        
        .control-panel { background: #2f3542; border: 2px solid #57606f; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: inline-block; text-align: left; max-width: 1200px; }
        .control-row { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .control-label { font-weight: bold; width: 60px; color: #ffa502; font-size: 14px; }
        select { padding: 4px; border-radius: 4px; background: #1e272e; color: white; border: 1px solid #57606f; font-size: 12px; }
        select option:disabled { color: #747d8c; background: #2f3542; }

        /* 프리셋 버튼 스타일 */
        .preset-group { margin-bottom: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .preset-btn { padding: 8px 15px; font-weight: bold; background: #1e90ff; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .preset-btn:hover { background: #3742fa; }
        .preset-btn.full-cond { background: #2ecc71; }
        .preset-btn.full-cond:hover { background: #27ae60; }

        .battlefield { position: relative; width: 1100px; height: 600px; margin: 0 auto; background-color: #1e272e; border: 3px solid #57606f; border-radius: 12px; overflow: hidden; }
        .character-card { position: absolute; width: 150px; background: rgba(47, 53, 66, 0.85); border: 2px solid; border-radius: 8px; padding: 6px; text-align: left; transform: translate(-50%, -50%); transition: all 0.2s ease-in-out; cursor: pointer; z-index: 1; }
        .character-card:hover { background: rgba(47, 53, 66, 1); transform: translate(-50%, -50%) scale(1.15); z-index: 10; box-shadow: 0 8px 12px rgba(0,0,0,0.8); }
        .blue-team { border-color: #1e90ff; }
        .red-team { border-color: #ff4757; }
        .char-img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; background: #747d8c; }
        .char-name { font-size: 13px; font-weight: bold; margin: 5px 0 2px 0; color: #f1f2f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 가시성 개선 CSS */
        .char-vars { font-size: 11px; margin-bottom: 5px; color: #f5f6fa; line-height: 1.4; }
        .stat-on { color: #2ecc71; font-weight: bold; }
        .stat-off { color: #7f8fa6; text-decoration: line-through; }
        .items { font-size: 11px; color: #eccc68; line-height: 1.2; word-break: keep-all; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 4px; font-weight: bold; }
        
        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .action-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        #reroll-btn { background-color: #ffa502; color: #2f3542; }
        #reroll-btn:hover { background-color: #ff7f50; }
        
        #eval-btn { background-color: #1e90ff; color: white; }
        #eval-btn:hover { background-color: #3742fa; }
        #evaluation-result { display: none; margin: 20px auto; padding: 20px; background: #2f3542; border: 2px dashed #1e90ff; border-radius: 8px; max-width: 800px; font-size: 16px; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>이터널리턴 3:3 구도 퍼즐</h1>
    
    <!-- 프리셋 제어판 -->
    <div class="preset-group">
        <button class="preset-btn" onclick="applyPreset(8, 1, 0, '낮', false)">☀️ 2낮 (Lv.8 / 전설1)</button>
        <button class="preset-btn" onclick="applyPreset(13, 3, 0, '밤', false)">🌙 3밤 (Lv.13 / 전설3)</button>
        <button class="preset-btn" onclick="applyPreset(15, 4, 0, '밤', false)">🌙 4밤 (Lv.15 / 전설4)</button>
        <button class="preset-btn" onclick="applyPreset(20, 4, 1, '낮', true)">🔥 막금구 (Lv.20 / 전설4 초월1)</button>
        <button class="preset-btn full-cond" onclick="applyFullCondition()">🔥 전체 풀컨디션 세팅</button>
    </div>

    <div class="control-panel">
        <div class="control-row">
            <span class="control-label">환경:</span>
            <select id="env-time"><option value="">시간 (랜덤)</option><option value="낮">낮</option><option value="밤">밤</option></select>
            <select id="env-terrain"><option value="">지형 (랜덤)</option><option value="좁은 골목">좁은 골목</option><option value="개활지">개활지</option><option value="벽과 장애물 지역">벽과 장애물</option></select>
        </div>
        <hr style="border-color: #57606f;">
        <div id="blue-controls"></div>
        <hr style="border-color: #57606f;">
        <div id="red-controls"></div>
    </div>
    
    <div id="env-display" style="font-size: 18px; font-weight: bold; color: #ffa502; margin-bottom: 10px;"></div>
    
    <div class="battlefield" id="battlefield-container"></div>
    
    <div class="btn-group">
        <button id="reroll-btn" class="action-btn" onclick="rollDice()">🎲 설정 적용 & 셔플</button>
        <button id="eval-btn" class="action-btn" onclick="showEvaluation()">💡 승률 예측 (Beta)</button>
    </div>

    <div id="evaluation-result"></div>

    <script>
        let characterPool = [];
        let synergyMatrix = {};
        let aiWeights = {};

        let currentBlueTeam = []; 
        let currentRedTeam = [];

        Promise.all([
            fetch('data.json').then(res => res.json()),
            fetch('synergy_matrix.json').then(res => res.json()).catch(() => ({})),
            fetch('heuristic_weights.json').then(res => res.json()).catch(() => ({}))
        ]).then(([data, matrix, weights]) => {
            // 미출시 캐릭터 세레스 숨김 처리
            characterPool = data.filter(c => c.name !== '세레스');
            synergyMatrix = matrix;
            aiWeights = weights;
            initDropdowns();
            rollDice();
        }).catch(error => console.error('데이터 로드 실패:', error));

        function applyPreset(level, legCnt, tranCnt, timePhase, isFullCond) {
            document.getElementById('env-time').value = timePhase;
            
            ['b', 'r'].forEach(team => {
                for(let i=0; i<3; i++) {
                    document.getElementById(`${team}-lvl-${i}`).value = level;
                    document.getElementById(`${team}-leg-${i}`).value = legCnt;
                    document.getElementById(`${team}-tran-${i}`).value = tranCnt;
                    updateItemOptions(team, i); 
                    
                    if(isFullCond) {
                        document.getElementById(`${team}-ult-${i}`).value = "ON";
                        document.getElementById(`${team}-wskill-${i}`).value = "ON";
                        document.getElementById(`${team}-tac-${i}`).value = "ON";
                    }
                }
            });
            rollDice();
        }

        function applyFullCondition() {
            ['b', 'r'].forEach(team => {
                for(let i=0; i<3; i++) {
                    document.getElementById(`${team}-ult-${i}`).value = "ON";
                    document.getElementById(`${team}-wskill-${i}`).value = "ON";
                    document.getElementById(`${team}-tac-${i}`).value = "ON";
                }
            });
            rollDice();
        }

        function initDropdowns() {
            let charOpts = '<option value="">캐릭터 (랜덤)</option>';
            characterPool.forEach(c => {
                const descText = c.description ? ` - ${c.description}` : '';
                charOpts += `<option value="${c.id}">${c.name} (${c.weapon})${descText}</option>`;
            });

            const ultOpts = `<option value="">궁 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            const wSkillOpts = `<option value="">무스 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            const tacSkillOpts = `<option value="">전술 (랜덤)</option><option value="ON">ON</option><option value="쿨다운">쿨다운</option>`;
            
            let lvlOpts = '<option value="">레벨 (랜덤)</option>';
            for(let i=1; i<=20; i++) lvlOpts += `<option value="${i}">Lv.${i}</option>`;
            
            let legOpts = '<option value="">전설 (랜덤)</option>';
            for(let i=0; i<=5; i++) legOpts += `<option value="${i}">🟪 ${i}개</option>`;
            
            let tranOpts = '<option value="">초월 (랜덤)</option>';
            for(let i=0; i<=5; i++) tranOpts += `<option value="${i}">🟥 ${i}개</option>`;

            const createTeamControls = (teamName, prefix) => {
                let html = `<div class="control-label" style="color:${prefix==='b'?'#1e90ff':'#ff4757'}">${teamName}</div>`;
                for(let i=0; i<3; i++) {
                    html += `
                        <div class="control-row" style="margin-left: 10px;">
                            <span style="color:#a4b0be; font-size:12px; width:40px; display:inline-block;">Slot ${i+1}:</span>
                            <select id="${prefix}-char-${i}" onchange="updateTeamDisables('${prefix}')">${charOpts}</select>
                            <select id="${prefix}-lvl-${i}">${lvlOpts}</select>
                            <select id="${prefix}-leg-${i}" onchange="updateItemOptions('${prefix}', ${i})">${legOpts}</select>
                            <select id="${prefix}-tran-${i}" onchange="updateItemOptions('${prefix}', ${i})">${tranOpts}</select>
                            <select id="${prefix}-ult-${i}">${ultOpts}</select>
                            <select id="${prefix}-wskill-${i}">${wSkillOpts}</select>
                            <select id="${prefix}-tac-${i}">${tacSkillOpts}</select>
                        </div>`;
                }
                return html;
            };

            document.getElementById('blue-controls').innerHTML = createTeamControls('BLUE', 'b');
            document.getElementById('red-controls').innerHTML = createTeamControls('RED', 'r');
        }

        function updateItemOptions(prefix, index) {
            const legEl = document.getElementById(`${prefix}-leg-${index}`);
            const tranEl = document.getElementById(`${prefix}-tran-${index}`);
            
            const legVal = legEl.value === "" ? 0 : parseInt(legEl.value);
            const tranVal = tranEl.value === "" ? 0 : parseInt(tranEl.value);

            Array.from(legEl.options).forEach(opt => {
                if (opt.value === "") opt.disabled = false;
                else opt.disabled = (parseInt(opt.value) + tranVal > 5);
            });

            Array.from(tranEl.options).forEach(opt => {
                if (opt.value === "") opt.disabled = false;
                else opt.disabled = (parseInt(opt.value) + legVal > 5);
            });
        }

        function updateTeamDisables(teamPrefix) {
            let selectedNames = [];
            for(let i=0; i<3; i++) {
                const val = document.getElementById(`${teamPrefix}-char-${i}`).value;
                if(val) {
                    const charObj = characterPool.find(c => c.id === val);
                    if(charObj) selectedNames.push(charObj.name.trim());
                }
            }
            
            for(let i=0; i<3; i++) {
                const selectEl = document.getElementById(`${teamPrefix}-char-${i}`);
                const currentVal = selectEl.value;
                let currentName = "";
                
                if(currentVal) {
                    const charObj = characterPool.find(c => c.id === currentVal);
                    if(charObj) currentName = charObj.name.trim();
                }
                
                Array.from(selectEl.options).forEach(opt => {
                    if (opt.value === "") {
                        opt.disabled = false;
                    } else {
                        const optCharObj = characterPool.find(c => c.id === opt.value);
                        if(optCharObj) {
                            opt.disabled = (selectedNames.includes(optCharObj.name.trim()) && optCharObj.name.trim() !== currentName);
                        }
                    }
                });
            }
        }

        function rollDice() {
            if (characterPool.length === 0) return;
            document.getElementById('evaluation-result').style.display = 'none'; 
            currentBlueTeam = [];
            currentRedTeam = [];

            const timeVal = document.getElementById('env-time').value || ['낮', '밤'][Math.floor(Math.random() * 2)];
            const terrainVal = document.getElementById('env-terrain').value || ['좁은 골목', '개활지', '벽과 장애물 지역'][Math.floor(Math.random() * 3)];
            document.getElementById('env-display').innerText = `현재 전장: ${timeVal} / ${terrainVal}`;

            const baseLevel = Math.floor(Math.random() * (16 - 10 + 1)) + 10; 
            
            let usedNamesBlue = [];
            let usedNamesRed = [];
            
            for(let i=0; i<3; i++) {
                let bVal = document.getElementById(`b-char-${i}`).value;
                let rVal = document.getElementById(`r-char-${i}`).value;
                
                if(bVal) {
                    const bChar = characterPool.find(c => c.id === bVal);
                    if(bChar) usedNamesBlue.push(bChar.name.trim());
                }
                if(rVal) {
                    const rChar = characterPool.find(c => c.id === rVal);
                    if(rChar) usedNamesRed.push(rChar.name.trim());
                }
            }

            // 🎲 Y축 가상 구역 분할 (겹침 완벽 방지)
            const yZones = [
                { min: 15, max: 35 },
                { min: 40, max: 60 },
                { min: 65, max: 85 }
            ];
            
            // 매 셔플마다 어느 구역에 들어갈지 랜덤하게 섞음
            const blueZones = [...yZones].sort(() => 0.5 - Math.random());
            const redZones = [...yZones].sort(() => 0.5 - Math.random());

            let html = '';

            const createSlot = (teamPrefix, index, isBlue) => {
                const charVal = document.getElementById(`${teamPrefix}-char-${index}`).value;
                const lvlVal = document.getElementById(`${teamPrefix}-lvl-${index}`).value;
                const legVal = document.getElementById(`${teamPrefix}-leg-${index}`).value;
                const tranVal = document.getElementById(`${teamPrefix}-tran-${index}`).value;
                const ultVal = document.getElementById(`${teamPrefix}-ult-${index}`).value;
                const wSkillVal = document.getElementById(`${teamPrefix}-wskill-${index}`).value;
                const tacVal = document.getElementById(`${teamPrefix}-tac-${index}`).value;

                let charData;
                if (charVal) {
                    charData = characterPool.find(c => c.id === charVal);
                } else {
                    let teamUsedNames = isBlue ? usedNamesBlue : usedNamesRed;
                    let availableChars = characterPool.filter(c => !teamUsedNames.includes(c.name.trim()));
                    charData = availableChars[Math.floor(Math.random() * availableChars.length)];
                    teamUsedNames.push(charData.name.trim()); 
                }

                const finalLvl = lvlVal ? parseInt(lvlVal) : baseLevel + Math.floor(Math.random() * 3);
                
                let finalLeg = 0;
                let finalTran = 0;
                
                if (legVal !== "" && tranVal !== "") {
                    finalLeg = parseInt(legVal);
                    finalTran = parseInt(tranVal);
                } else if (legVal === "" && tranVal === "") {
                    const totalItems = Math.floor(Math.random() * 6);
                    for(let j=0; j<totalItems; j++) {
                        if (Math.random() < 0.15) finalTran++;
                        else finalLeg++;
                    }
                } else if (legVal === "") {
                    finalTran = parseInt(tranVal);
                    const maxLeg = 5 - finalTran;
                    finalLeg = Math.floor(Math.random() * (maxLeg + 1));
                } else if (tranVal === "") {
                    finalLeg = parseInt(legVal);
                    const maxTran = 5 - finalLeg;
                    for(let j=0; j<maxTran; j++) {
                         if (Math.random() < 0.15) finalTran++;
                    }
                }

                const finalUlt = ultVal ? ultVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                const finalWskill = wSkillVal ? wSkillVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                const finalTac = tacVal ? tacVal : (Math.random() > 0.5 ? 'ON' : '쿨다운');
                
                const matchData = { 
                    name: charData.name, 
                    weapon: charData.weapon, 
                    role: charData.role, 
                    description: charData.description, 
                    ult_dependency: charData.ult_dependency || 1.0,
                    level: finalLvl, 
                    legendary: finalLeg, 
                    transcendent: finalTran,
                    ult: finalUlt, 
                    wskill: finalWskill, 
                    tac: finalTac 
                };
                
                if (isBlue) currentBlueTeam.push(matchData);
                else currentRedTeam.push(matchData);

                // 💡 지터링을 통한 좌표 생성
                const minX = isBlue ? 8 : 55;
                const maxX = isBlue ? 45 : 92;
                const posX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                
                // 배정받은 구역 내에서만 Y좌표를 랜덤하게 흔듦
                const myZone = isBlue ? blueZones[index] : redZones[index];
                const posY = Math.floor(Math.random() * (myZone.max - myZone.min + 1)) + myZone.min;
                
                let itemsText = '템 없음';
                if (finalLeg > 0 || finalTran > 0) {
                    itemsText = `🟪 전설 ${finalLeg} / 🟥 초월 ${finalTran}`;
                }
                
                const getStatusSpan = (label, status) => status === 'ON' ? `<span class="stat-on">${label}: ON</span>` : `<span class="stat-off">${label}: OFF</span>`;
                const roleBadge = charData.role ? `<span style="background: #ffa502; color: #2f3542; padding: 2px 4px; border-radius: 4px; font-weight: bold; font-size: 10px;">${charData.role}</span>` : '';
                const descBadge = charData.description ? `<span style="background: #1e90ff; color: white; padding: 2px 4px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-left: 4px;">${charData.description}</span>` : '';

                return `
                    <div class="character-card ${isBlue ? 'blue-team' : 'red-team'}" style="left: ${posX}%; top: ${posY}%;">
                        <img src="${charData.image}" alt="${charData.name}" class="char-img" onerror="this.style.display='none'">
                        <h3 class="char-name">${charData.name} (${charData.weapon})</h3>
                        <div class="char-vars">
                            <div style="margin-bottom: 4px;">${roleBadge}${descBadge}</div>
                            <strong>Lv.${finalLvl}</strong><br>
                            ${getStatusSpan('궁', finalUlt)} | ${getStatusSpan('무스', finalWskill)}<br>
                            ${getStatusSpan('전술', finalTac)}
                        </div>
                        <div class="items">${itemsText}</div>
                    </div>
                `;
            };

            for(let i=0; i<3; i++) html += createSlot('b', i, true);
            for(let i=0; i<3; i++) html += createSlot('r', i, false);

            document.getElementById('battlefield-container').innerHTML = html;
        }

        // 💡 고도화된 평가 엔진 (상성 베이스라인 + 다이나믹 스킬 가중치)
        function showEvaluation() {
            if (currentBlueTeam.length === 0) return;

            const timeValInput = document.getElementById('env-time').value;
            const terrainValInput = document.getElementById('env-terrain').value;
            const timeVal = timeValInput || (document.getElementById('env-display').innerText.includes('밤') ? '밤' : '낮');
            const terrainVal = terrainValInput || ['좁은 골목', '개활지', '벽과 장애물 지역'].find(t => document.getElementById('env-display').innerText.includes(t)) || '';

            // 💡 엔진 전투력 합산 함수
            const getPowerScore = (team) => {
                return team.reduce((sum, char) => {
                    let lvlPts = aiWeights.LEVEL_PER_PERSON || 22.73; // 최신 AI 도출 레벨 점수
                    let legPts = aiWeights.LEGENDARY_ITEM || 20.0;
                    let tranPts = aiWeights.TRANSCENDENT_ITEM || 93.49; // 최신 초월템 점수

                    let score = (char.level * lvlPts) + (char.legendary * legPts) + (char.transcendent * tranPts);
                    
                    if (char.ult === 'ON') {
                        score += 30;
                    } else {
                        score -= (30 * char.ult_dependency) - 30;
                    }

                    if (char.wskill === 'ON') score += 15;
                    if (char.tac === 'ON') score += 20;
                    
                    // 환경 보정
                    if (terrainVal === '좁은 골목' && (char.role === '퓨어탱커' || char.role === '탱브루저')) score *= 1.15;
                    if (terrainVal === '개활지' && char.role.includes('원딜')) score *= 1.15;
                    if (timeVal === '밤' && (char.role === '암살자' || char.role === '딜브루저')) score *= 1.10;

                    // 🚨 버그 방지: 계산된 score를 sum에 누적해서 반환!
                    return sum + score; 
                }, 0);
            };

            const bluePower = getPowerScore(currentBlueTeam);
            const redPower = getPowerScore(currentRedTeam);
            const totalPower = bluePower + redPower;
            
            // 역할군 키 조합 (상성 매트릭스 탐색용)
            const getDeckKey = (team) => team.map(c => c.role).sort().join(" + ");
            const blueDeckKey = getDeckKey(currentBlueTeam);
            const redDeckKey = getDeckKey(currentRedTeam);
            const synergyKey = `${blueDeckKey} VS ${redDeckKey}`;
            
            // AI 베이스라인 승률 (데이터가 없거나 못 불러왔을 경우 대비 50.0으로 초기화)
            const baseSynergyWinRate = synergyMatrix[synergyKey] || 50.0;
            
            // NaN 방지 및 전투력 비율에 따른 추가 승률 스노우볼
            let powerDiffRatio = 0;
            if (totalPower > 0) {
                powerDiffRatio = (bluePower - redPower) / totalPower; 
            }
            
            let finalWinRate = baseSynergyWinRate + (powerDiffRatio * 150); 
            
            // 승률을 5.0 ~ 95.0 사이로 제한
            finalWinRate = Math.max(5.0, Math.min(95.0, finalWinRate));
            
            const isBlueAdvantage = finalWinRate >= 50.0;
            const winningTeam = isBlueAdvantage ? "<span style='color:#1e90ff'>블루팀</span>" : "<span style='color:#ff4757'>레드팀</span>";
            
            // 승자 기준 확률로 변환
            const displayWinRate = isBlueAdvantage ? finalWinRate : (100.0 - finalWinRate);
            
            // ✨ 소수점 2번째 자리까지 표기 변경
            const finalWinRateText = displayWinRate.toFixed(2);

            const resultHtml = `
                <strong style="color: #1e90ff; font-size: 18px;">[💡 승률 예측 결과]</strong><br><br>
                📊 <strong>판세 분석:</strong> AI 조합 상성 + 인게임 체급 융합 기준<br>
                ▶ <strong>${winningTeam} 승률 약 ${finalWinRateText}%</strong>
            `;

            const resultDiv = document.getElementById('evaluation-result');
            resultDiv.innerHTML = resultHtml;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
