<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이터널리턴 3:3 구도 퍼즐</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c2f33; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 5px; }
        
        /* 1. 환경 변수 패널 */
        .env-panel { 
            background: #ffa502; color: #2f3542; padding: 10px 20px; 
            border-radius: 8px; display: inline-block; font-size: 18px; font-weight: bold; margin-bottom: 20px; 
        }

        /* 2. 2D 전장 보드 */
        .battlefield { 
            position: relative; width: 900px; height: 500px; margin: 0 auto;
            background-color: #1e272e; border: 3px solid #57606f; border-radius: 12px; overflow: hidden;
        }
        /* 중앙 경계선 (참고용) */
        .battlefield::after {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: dashed rgba(255, 255, 255, 0.2);
        }

        /* 3. 흩뿌려질 캐릭터 카드 (미니 버전) */
        .character-card { 
            position: absolute; width: 140px; background: rgba(47, 53, 66, 0.9); 
            border: 2px solid; border-radius: 8px; padding: 8px; text-align: left;
            transform: translate(-50%, -50%); /* 중심점 맞추기 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .blue-team { border-color: #1e90ff; }
        .red-team { border-color: #ff4757; }

        .char-img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; background: #747d8c; }
        .char-name { font-size: 14px; font-weight: bold; margin: 5px 0 2px 0; color: #f1f2f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-vars { font-size: 11px; color: #a4b0be; line-height: 1.2; margin-bottom: 4px; }
        .items { font-size: 10px; color: #eccc68; line-height: 1.2; word-break: keep-all; }
        
        #reroll-btn { 
            margin-top: 20px; padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ffa502; color: #2f3542; border: none; border-radius: 8px; cursor: pointer;
        }
        #reroll-btn:hover { background-color: #ff7f50; }
    </style>
</head>
<body>

    <h1>이터널리턴 3:3 구도 퍼즐 (MVP v2)</h1>
    
    <!-- 전장 환경 패널 -->
    <div id="env-display" class="env-panel">전장 환경을 불러오는 중...</div>
    
    <!-- 2D 전장 보드 -->
    <div class="battlefield" id="battlefield-container">
        <!-- 카드가 생성되어 무작위 배치될 위치 -->
    </div>

    <button id="reroll-btn" onclick="rollDice()">🎲 구도 및 진형 셔플</button>

    <script>
        let characterPool = [];

        // 데이터 로드
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                characterPool = data;
                rollDice();
            })
            .catch(error => console.error('데이터 로드 실패:', error));

        // 카드 HTML 생성 및 무작위 위치 배정 함수
        function createPositionedCard(charData, isBlueTeam) {
            // 체력 상황 3가지로 제한
            const hpOptions = [100, 70, 50];
            const charHealth = hpOptions[Math.floor(Math.random() * hpOptions.length)];
            
            // X 좌표: 블루팀(5~45%), 레드팀(55~95%) 영역 안에서 무작위
            const posX = isBlueTeam ? Math.floor(Math.random() * 41) + 5 : Math.floor(Math.random() * 41) + 55;
            // Y 좌표: 위아래(10~90%) 영역 안에서 무작위
            const posY = Math.floor(Math.random() * 81) + 10;
            
            const teamClass = isBlueTeam ? 'blue-team' : 'red-team';

            return `
                <div class="character-card ${teamClass}" style="left: ${posX}%; top: ${posY}%;">
                    <img src="${charData.image}" alt="${charData.name}" class="char-img" onerror="this.style.display='none'">
                    <h3 class="char-name">${charData.name} (${charData.weapon})</h3>
                    <div class="char-vars">
                        Lv.${charData.level} | 체력: ${charHealth}%<br>궁극기: ${charData.has_ult}
                    </div>
                    <div class="items">코어: ${charData.items_text}</div>
                </div>
            `;
        }

        // 셔플 로직
        function rollDice() {
            if (characterPool.length < 6) return;

            // 1. 환경 변수 세팅
            const terrains = ['좁은 골목', '개활지', '벽과 장애물 지역'];
            const times = ['낮', '밤'];
            
            const currentTerrain = terrains[Math.floor(Math.random() * terrains.length)];
            const currentTime = times[Math.floor(Math.random() * times.length)];
            document.getElementById('env-display').innerText = `현재 전장: ${currentTime} / ${currentTerrain}`;

            // 2. 캐릭터 변수 세팅
            const baseLevel = Math.floor(Math.random() * (16 - 10 + 1)) + 10; 
            const shuffled = [...characterPool].sort(() => 0.5 - Math.random());
            
            const finalTeamData = shuffled.slice(0, 6).map(char => {
                const legCount = Math.floor(Math.random() * 6);
                const items = legCount > 0 ? char.core_items_order.slice(0, legCount).join(', ') : '전설 없음';

                return {
                    ...char,
                    level: baseLevel + Math.floor(Math.random() * 3),
                    has_ult: Math.random() > 0.5 ? 'ON' : '쿨다운',
                    items_text: items
                };
            });

            // 3. 화면 렌더링 (흩뿌리기)
            const blueTeamHTML = finalTeamData.slice(0, 3).map(char => createPositionedCard(char, true)).join('');
            const redTeamHTML = finalTeamData.slice(3, 6).map(char => createPositionedCard(char, false)).join('');

            document.getElementById('battlefield-container').innerHTML = blueTeamHTML + redTeamHTML;
        }
    </script>
</body>
</html>
