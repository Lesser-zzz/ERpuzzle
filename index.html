<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이터널리턴 3:3 구도 퍼즐</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c2f33; color: white; text-align: center; }
        .board { display: flex; justify-content: space-around; margin-top: 50px; }
        .team { display: flex; flex-direction: column; gap: 20px; width: 40%; }
        .team-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .red-team { color: #ff4757; }
        .blue-team { color: #1e90ff; }
        
        .character-card { 
            background: #2f3542; padding: 15px; border-radius: 8px; 
            border: 2px solid #57606f; display: flex; gap: 15px; align-items: center;
        }
        .char-img { width: 80px; height: 80px; background-color: #747d8c; border-radius: 5px; object-fit: cover; }
        .char-info { text-align: left; flex-grow: 1; }
        .char-name { font-size: 20px; font-weight: bold; margin: 0 0 5px 0; color: #f1f2f6; }
        .char-vars { font-size: 14px; color: #a4b0be; margin-bottom: 5px; }
        .items { font-size: 12px; color: #eccc68; }
        
        #reroll-btn { 
            margin-top: 40px; padding: 15px 40px; font-size: 20px; font-weight: bold;
            background-color: #ffa502; color: #2f3542; border: none; border-radius: 8px; cursor: pointer;
        }
        #reroll-btn:hover { background-color: #ff7f50; }
    </style>
</head>
<body>

    <h1>이터널리턴 3:3 구도 퍼즐 (MVP)</h1>
    
    <div class="board">
        <!-- 블루팀 -->
        <div class="team" id="blue-team-container">
            <div class="team-title blue-team">BLUE TEAM</div>
            <!-- 카드가 생성될 위치 -->
        </div>

        <!-- 레드팀 -->
        <div class="team" id="red-team-container">
            <div class="team-title red-team">RED TEAM</div>
            <!-- 카드가 생성될 위치 -->
        </div>
    </div>

    <button id="reroll-btn" onclick="rollDice()">🎲 구도 셔플 (Reroll)</button>

    <script>
        let characterPool = [];

        // 1. data.json 파일 불러오기
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                characterPool = data;
                rollDice(); // 첫 로딩 시 바로 셔플 1회 실행
            })
            .catch(error => console.error('데이터 로드 실패:', error));

        // 2. 카드 HTML 생성 함수
        function createCardHTML(charData) {
            return `
                <div class="character-card">
                    <img src="${charData.image}" alt="${charData.name}" class="char-img" onerror="this.style.display='none'">
                    <div class="char-info">
                        <h3 class="char-name">${charData.name} (${charData.weapon})</h3>
                        <div class="char-vars">
                            Lv.${charData.level} | 체력: ${charData.health_percent}% | 궁극기: ${charData.has_ult}
                        </div>
                        <div class="items">코어: ${charData.items_text}</div>
                    </div>
                </div>
            `;
        }

        // 3. 주사위 굴리기 (셔플 로직)
        function rollDice() {
            if (characterPool.length < 6) return;

            // 이번 매치의 '기준 레벨' 생성 (10 ~ 16레벨 사이)
            const baseLevel = Math.floor(Math.random() * (16 - 10 + 1)) + 10; 

            // 데이터 풀 섞기
            const shuffled = [...characterPool].sort(() => 0.5 - Math.random());
            const selectedChars = shuffled.slice(0, 6);

            // 6명의 캐릭터에게 랜덤 변수 부여
            const finalTeamData = selectedChars.map(char => {
                // 기준 레벨에 0~2를 더해서 최대 2레벨 차이만 나도록 설정
                const charLevel = baseLevel + Math.floor(Math.random() * 3); 
                
                // 전설 아이템 개수 랜덤 설정 (0~5개)
                const legCount = Math.floor(Math.random() * 6);
                const items = legCount > 0 ? char.core_items_order.slice(0, legCount).join(', ') : '전설 아이템 없음 (0코어)';

                return {
                    ...char,
                    level: charLevel,
                    health_percent: Math.floor(Math.random() * 100) + 1,
                    has_ult: Math.random() > 0.5 ? 'ON' : '쿨다운',
                    items_text: items
                };
            });

            // 6명을 양 팀에 3명씩 분배
            const blueTeam = finalTeamData.slice(0, 3);
            const redTeam = finalTeamData.slice(3, 6);

            // 화면에 렌더링
            document.getElementById('blue-team-container').innerHTML = 
                '<div class="team-title blue-team">BLUE TEAM</div>' + 
                blueTeam.map(char => createCardHTML(char)).join('');
                
            document.getElementById('red-team-container').innerHTML = 
                '<div class="team-title red-team">RED TEAM</div>' + 
                redTeam.map(char => createCardHTML(char)).join('');
        }
    </script>
</body>
</html>
