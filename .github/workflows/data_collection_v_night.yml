name: Eternal Return V-NIGHT Pipeline

on:
  schedule:
    # 매일 한국 시간 기준 01:00, 08:00 (UTC 16:00, 23:00)에 실행
    - cron: '0 16,23 * * *'
  workflow_dispatch:

concurrency:
  group: er-vnight-collector
  cancel-in-progress: false

jobs:
  collect-data-night:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 🚀 V-NIGHT 심야 스크립트 실행 (최대 5.5시간)
        env:
          BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
        run: |
          python collect_data_v_night.py

      - name: 💾 데이터 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add \
            er_makgeumgu_dataset_v3_rescued.csv \
            snowball_pending_add.txt \
            snowball_processed.txt \
            known_games.txt

          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
            exit 0
          fi

          git commit -m "🤖 [자동] V-NIGHT 심야 대량 수집 완료"
          git fetch origin main
          git rebase origin/main
          git push origin main
