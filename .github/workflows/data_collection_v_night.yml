name: Eternal Return V-NIGHT Pipeline

on:
  schedule:
    - cron: '0 16,23 * * *'
  workflow_dispatch:

concurrency:
  group: er-data-collector-queue
  cancel-in-progress: false

jobs:
  collect-data-night:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🧹 탐색 닉네임 메모리 100% 초기화
        run: |
          > snowball_processed.txt
          > snowball_pending_add.txt

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 🚀 V-NIGHT 심야 스크립트 실행
        env:
          BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
        run: |
          python collect_data_v_night.py

      - name: 💾 데이터 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add \
            er_makgeumgu_dataset_v3_rescued.csv \
            snowball_pending_add.txt \
            snowball_processed.txt \
            known_games.txt

          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
            exit 0
          fi

          git commit -m "🤖 [자동] V-NIGHT 실시간 데이터 동기화 완료"
          git fetch origin main
          git pull --rebase origin main
          git push origin main
