name: Eternal Return Data Pipeline

on:
  schedule:
    # 한국 시간 기준 01:00 ~ 09:00
    # UTC 기준 16:00 ~ 00:00
    - cron: '*/10 16-23,0 * * *'
  workflow_dispatch:

# 같은 수집 작업이 동시에 두 개 실행되지 않도록 방지
concurrency:
  group: er-makgeumgu-collector
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 🚀 데이터 수집 스크립트 실행
        env:
          BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
        run: |
          python collect_data.py

      - name: 💾 수집 데이터 및 Snowball 상태 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add \
            er_makgeumgu_dataset_v2.csv \
            snowball_pending_add.txt \
            snowball_processed.txt \
            known_games.txt

          git diff --cached --quiet || (
            git commit -m "🤖 [자동] 막금구 데이터 수집 업데이트" &&
            git push
          )
