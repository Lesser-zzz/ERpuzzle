name: Eternal Return Data Pipeline

on:
  schedule:
    # 매일 한국 시간 기준 새벽 1시 ~ 아침 9시까지 15분 간격 (UTC 16:00 ~ 00:00)
    - cron: '*/10 16-23,0 * * *'
  workflow_dispatch: # 수동 실행 버튼 유지

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 리포지토리 체크아웃
        uses: actions/checkout@v3

      - name: 🐍 파이썬 환경 세팅 (3.9 버전)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 🚀 데이터 수집 스크립트 실행
        env:
          BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
        run: |
          python collect_data.py

      - name: 💾 변경된 CSV 파일 깃허브에 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add er_makgeumgu_dataset_v2.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [자동] 막금구 데이터 수집 업데이트" && git push)
