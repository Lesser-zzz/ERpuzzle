name: Eternal Return Data Pipeline

on:
  schedule:
    # 매일 한국 시간 기준 새벽 1시 ~ 아침 9시까지 15분 간격 (UTC 16:00 ~ 00:00)
    - cron: '*/30 16-23,0 * * *'
  workflow_dispatch:

# 중복 실행 방지
concurrency:
  group: er-normal-collector
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 필요 라이브러리 설치
        run: |
          pip install requests

      - name: 🚀 데이터 수집 스크립트 실행
        env:
          BSER_API_KEY: ${{ secrets.BSER_API_KEY }}
        run: |
          python collect_data.py

      - name: 💾 데이터 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add \
            er_makgeumgu_dataset_v3_rescued.csv \
            snowball_pending_add.txt \
            snowball_processed.txt \
            known_games.txt

          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
            exit 0
          fi

          git commit -m "🤖 [자동] 막금구 데이터 수집 완료"
          
          # 💡 [충돌 방지 로직] 푸시 전 서버의 최신 커밋을 불러와 부드럽게 이어 붙임
          git fetch origin main
          git rebase origin/main
          
          git push origin main
